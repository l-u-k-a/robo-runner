<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robo Runner</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0710;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #frame {
        padding: 10px;
        background: #2a1a10;
        border: 4px solid #6b4423;
        box-shadow:
          0 0 0 4px #1a0f08,
          0 0 40px #000;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="game" aria-label="Robo Runner game" role="img"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
